<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
         /* Removes default margin */
            font-family: Arial, sans-serif; /* Example font family */
        }

        .centered-div { 
            
            background-color: #4CAF50; /* Example background color */
            /* text-align: center;    Centers text inside the div */
            color: white;          /* Text color */     
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Optional shadow */
        }

        /* h1 {
            font-size: 2em;       /* Responsive heading size */

        /* } */ 

        p {
            /* font-size: 1em;       Responsive paragraph size */
        }

    </style>
</head>
<body>
    <div class="centered-div">
        <!-- <h1>Centered Title</h1> -->
        <p>This is a responsive centered div. 
            The text is aligned properly, 
            and it adapts to different screen sizes!</p>
    </div>
</body>
</html>
